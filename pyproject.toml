[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gsy-profilecard"
version = "1.0.0"
description = "Generates the CarGuo GitHub profile card SVGs (neofetch-style) from live GitHub stats"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
art = ["pillow", "numpy"]
dev = ["pytest"]

[project.scripts]
gsy-profilecard = "gsy_profilecard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gsy_profilecard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
